{% extends "store/base.html" %}

{% block title %}
Login
{% endblock %}


{% block content %}


<h1>
    Login
</h1>


<form
    method="POST"
    class="form-box"
>

    {% csrf_token %}

    {{ form.as_p }}


    <button
        type="submit"
        class="btn"
    >
        Login
    </button>

</form>


<p>

    Don't have an account?

    <a href="{% url 'register' %}">
        Register
    </a>

</p>


{% endblock %}
