{% extends "store/base.html" %}

{% block title %}
Order Successful
{% endblock %}


{% block content %}


<div class="success">


    <h1>
        🎉 Order Placed Successfully!
    </h1>


    <p>
        Your order number is:
    </p>


    <h2>
        #{{ order.id }}
    </h2>


    <p>
        Total Amount:
        ₹{{ order.total_amount }}
    </p>


    <a
        href="{% url 'home' %}"
        class="btn"
    >
        Continue Shopping
    </a>


</div>


{% endblock %}
