{% extends "store/base.html" %}

{% block title %}
Checkout
{% endblock %}


{% block content %}

<h1>
    Checkout
</h1>


<h2>
    Order Summary
</h2>


{% for item in cart_items %}

<p>

    {{ item.product.name }}

    ×

    {{ item.quantity }}

    =

    ₹{{ item.total }}

</p>

{% endfor %}


<h2>
    Total: ₹{{ grand_total }}
</h2>


<form method="POST">

    {% csrf_token %}

    <button
        class="btn"
        type="submit"
    >
        Place Order
    </button>

</form>


{% endblock %}
