<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Successful</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
        }

        .success-box {
            width: 90%;
            max-width: 500px;
            margin: 80px auto;
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .success-icon {
            font-size: 70px;
            color: green;
        }

        h1 {
            color: #222;
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
            color: #555;
        }

        .product-name {
            font-weight: bold;
            color: #222;
        }

        .btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 25px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
        }

        .btn:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>

    <div class="success-box">

        <div class="success-icon">
            ✓
        </div>

        <h1>Order Placed Successfully!</h1>

        <p>
            Thank you for your order.
        </p>

        <p>
            Product:
            <span class="product-name">
                {{ product.name }}
            </span>
        </p>

        <p>
            Your order has been received successfully.
        </p>

        <a href="/" class="btn">
            Continue Shopping
        </a>

    </div>

</body>
</html>
