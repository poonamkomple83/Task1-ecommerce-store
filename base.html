<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        My E-Commerce Store
        {% endblock %}
    </title>

    {% load static %}

    <link
        rel="stylesheet"
        href="{% static 'store/css/style.css' %}"
    >

</head>


<body>


<nav class="navbar">

    <div class="logo">
        MyStore
    </div>


    <div class="nav-links">

        <a href="{% url 'home' %}">
            Home
        </a>

        <a href="{% url 'cart' %}">
            Cart 🛒
        </a>


        {% if user.is_authenticated %}

            <span>
                Hello, {{ user.username }}
            </span>

            <form
                method="POST"
                action="{% url 'logout' %}"
                style="display:inline;"
            >

                {% csrf_token %}

                <button type="submit">
                    Logout
                </button>

            </form>

        {% else %}

            <a href="{% url 'login' %}">
                Login
            </a>

            <a href="{% url 'register' %}">
                Register
            </a>

        {% endif %}

    </div>

</nav>


<div class="container">


    {% if messages %}

        {% for message in messages %}

            <div class="message">

                {{ message }}

            </div>

        {% endfor %}

    {% endif %}


    {% block content %}
    {% endblock %}


</div>


<script src="{% static 'store/js/script.js' %}"></script>


</body>

</html>
